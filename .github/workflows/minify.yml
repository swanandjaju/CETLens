name: Build and Deploy Minified Site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install minifiers
        run: npm install --no-save terser clean-css-cli
      - name: Build static site
        run: |
          mkdir _site
          rsync -a --exclude '.git' --exclude '_site' --exclude 'node_modules' ./ _site/
          for file in js/*.js; do
            npx terser "$file" --compress --mangle --output "_site/$file"
          done
          npx cleancss -o _site/css/style.css css/style.css
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
